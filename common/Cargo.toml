[package]
name = "common"
version = "0.1.0"
edition = "2024"

[features]
default = ["database"]
database = ["sqlx"]

[dependencies]
anyhow = "1.0.99"
async-nats = { version = "0.42.0", features = ["service"] }
base64 = "0.22.1"
flexbuffers = "25.2.10"
futures = "0.3.31"
num_enum = "0.7.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
#sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate"], optional = true }
sqlx = { features = ["runtime-tokio", "sqlite", "macros", "migrate"], path = "/home/djarb/source/others/sqlx", optional = true }
tokio = { version = "1.47.1", features = ["full"] }
hex = "0.4.3"
sha2 = "0.10.9"
jiff = "0.2.15"
ulid = { version = "1.2.1", features = ["serde"] }
tracing = "0.1"
uuid = "1.18"
strum = { version = "0.27", features = ["derive"] }
scraper = "0.24.0"
pulldown-cmark = "0.13.0"
ego-tree = "0.10.0"
