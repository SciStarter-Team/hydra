[package]
name = "forum-service"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
anyhow = "1.0.99"
async-nats = { version = "0.42.0", features = ["service"] }
flexbuffers = "25.2.10"
futures = "0.3.31"
regex = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "sqlite-load-extension", "macros", "migrate", "sqlx-toml"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.19"
ulid = { version = "1.2.1", features = ["serde"] }
jiff = "0.2.15"
