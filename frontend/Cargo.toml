[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
async-nats = "0.42.0"
badgebuilder = { git = "https://git.sr.ht/~djarb/badgebuilder", version = "0.1.4" }
flexbuffers = "25.2.10"
jiff = { version = "0.2.15", features = ["serde"] }
object_store = { version = "0.12.3", features = ["aws"] }
poem = { version = "3.1.12", features = ["sse", "cookie", "csrf", "multipart", "rustls", "session", "static-files", "embed", "i18n", "anyhow"] }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"] }
rust-embed = "8.7.2"
sailfish = "0.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_qs = "0.15"
strum = { version = "0.27", features = ["derive"] }
#sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate", "sqlx-toml"] }
sqlx = { features = ["runtime-tokio", "sqlite", "macros", "migrate", "sqlx-toml"], path = "/home/djarb/source/others/sqlx/" }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
ulid = { version = "1.2.1", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
base64 = "0.22.1"
futures = "0.3.31"
anyhow = "1.0.99"
urlencoding = "2.1.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
webauthn-rs = "0.5.2"
uuid = "1.18"
rand = "0.8"
scraper = "0.22"
regex = "1.11"
pulldown-cmark = "0.12"
markdown-ppp = "1.4.1"
ego-tree = "0.10"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
jsonwebtoken = "9.3"
rsa = "0.9"
aho-corasick = "1.1"
fxhash = "0.2.1"
parking_lot = "0.12.5"
smallvec = "1.15"
oxidize-pdf = "2.0.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
walkdir = "2"

[dev-dependencies]
assert2 = "0.3.16"
tokio = { version = "1.47.1", features = ["rt", "macros"] }

