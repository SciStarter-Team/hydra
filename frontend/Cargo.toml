[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
async-nats = "0.40.0"
flexbuffers = "25.2.10"
jiff = { version = "0.2.5", features = ["serde"] }
object_store = { version = "0.12.0", features = ["aws"] }
poem = { version = "3.1.8", features = ["sse", "cookie", "csrf", "multipart", "rustls", "session", "static-files", "embed", "i18n"] }
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }
rust-embed = "8.6.0"
sailfish = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
#sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sqlx = { features = ["runtime-tokio", "sqlite", "macros", "migrate"], path = "/home/djarb/source/others/sqlx/" }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
ulid = { version = "1.2.1", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
base64 = "0.22.1"
futures = "0.3.31"
anyhow = "1.0.97"
