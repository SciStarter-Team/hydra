# To get the Shenzi tool which uses this file to generate the contents
# of the dist directory, install the Rust compiler and then run
# `cargo install --git https://git.sr.ht/~djarb/shenzi`

input = "static"
output = "dist"

# Mirrored third-party files keep their original paths exactly, since that is
# how they are found (see vendor.sh). The first matching rule applies, so this
# one has to stay ahead of the *.min.* renames below.
[[rules]]
include = "mirror/**"
handler = "Copy"

[[rules]]
include = "**/*.xcf"
handler = "Ignore"

[[rules]]
include = "vendor.sh"
handler = "Ignore"

[[rules]]
include = "css/safelist.txt"
handler = "Ignore"

[[rules]]
include = "css/style.css"
handler = {Command = ["tailwindcss", "--minify", "--input", "$infile", "--output", "$outfile"]}
skip_unchanged = false

[[rules]]
include = "**/*.min.js"
handler = "Copy"
rename = "$1$2.js"

[[rules]]
include = "**/*.min.css"
handler = "Copy"
rename = "$1$2.css"
