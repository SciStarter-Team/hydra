# To get the Shenzi tool which uses this file to generate the contents
# of the dist directory, install the Rust compiler and then run
# `cargo install --git https://git.sr.ht/~djarb/shenzi`

input = "static"
output = "dist"

[[rules]]
include = "**/*.xcf"
handler = "Ignore"

[[rules]]
include = "update.sh"
handler = "Ignore"

[[rules]]
include = "css/style.css"
handler = {Command = ["tailwindcss", "--minify", "--input", "$infile", "--output", "$outfile"]}
skip_unchanged = false

# This rule skips minifying webawesome js files. That's fine since
# they're small anyway, but once shenzi is able to minify them without
# hitting a panic in minify_js this rule can be removed.
[[rules]]
include = "webawesome/**/*.js"
handler = "Copy"

[[rules]]
include = "**/*.min.js"
handler = "Copy"
rename = "$1$2.js"

[[rules]]
include = "**/*.min.css"
handler = "Copy"
rename = "$1$2.css"
