<script>
(function(){
  const tabRow = document.getElementById('tabRow');
  const chevron = document.getElementById('chevron');
  const chevBtn = document.getElementById('chevBtn');
  const tabs = Array.from(tabRow.querySelectorAll('.tab'));
  const panels = Array.from(document.querySelectorAll('.tab-panel'));

  function updateChevron(){
    const overflowRight = tabRow.scrollWidth - (tabRow.scrollLeft + tabRow.clientWidth);
    if (overflowRight > 1) chevron.classList.remove('hidden');
    else chevron.classList.add('hidden');
  }
  chevBtn.addEventListener('click', () => {
    tabRow.scrollBy({ left: tabRow.clientWidth*0.7, behavior: 'smooth' });
  });
  tabRow.addEventListener('scroll', updateChevron, { passive:true });
  window.addEventListener('resize', updateChevron);
  window.addEventListener('load', updateChevron);

  // Tab switching
  tabRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    tabs.forEach(t => t.setAttribute('aria-selected','false'));
    panels.forEach(p => p.setAttribute('aria-hidden','true'));
    btn.setAttribute('aria-selected','true');
    const panel = document.getElementById(btn.getAttribute('aria-controls'));
    if (panel) panel.setAttribute('aria-hidden','false');
  });
})();
</script>
