   <script>
const USE_FAKE_DATA = false; // toggle for testing

// Dummy fallback JSON
const fakeData = {
  date: "2025-04-09",
  number: 1458054,
  date_reached: null
};

function parseDateOnly(dateString) {
  if (!dateString || typeof dateString !== "string") return null;
  const [year, month, day] = dateString.split("-").map(Number);
  if (!year || !month || !day) return null;
  return new Date(year, month - 1, day);
}

async function fetchAPI() {
  const res = await fetch("https://scistarter.org/api/acts-to-date");
  if (!res.ok) throw new Error("Bad response from API");
  return res.json();
}

async function updateTestTubeCounter() {
  let data;

  // --- get data (API or fallback) ---
  try {
    data = USE_FAKE_DATA ? fakeData : await fetchAPI();
  } catch (err) {
    console.warn("API failed, using fallback", err);
    data = fakeData;
  }

  const { date, number, date_reached } = data;

  // Cap number at 2,500,000 for all layout math
    const cappedNumber = Math.min(number, 2500000);

    // Compute animation duration between 100ms → 3000ms
    const ratio = cappedNumber / 2500000; 
    const duration = 100 + (3000 - 100) * ratio; // in ms
    const durationSec = duration / 1000; // CSS uses seconds


  const targetDate = parseDateOnly(date);
  const reachedDate = parseDateOnly(date_reached);

 
  const formattedDate = targetDate.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric"
  });

  document.querySelector("#test-tube-counter .tt-date").textContent =
    formattedDate;

  document.querySelector("#test-tube-counter .tt-count").textContent =
    number.toLocaleString();


  // Shared base formula
  const base = (cappedNumber / 250000) * 37;

  // counter bottom = base + 6
  const tt_counter = document.getElementById("test-tube-counter");
  tt_counter.style.bottom = `${base + 6}px`;
  tt_counter.style.opacity = 1;

  // fill height = base + 2
  document.getElementById("test-tube-fill").style.height = `${base + 2}px`;

  // fill-top bottom = base + 40
  document.getElementById("test-tube-fill-top").style.bottom = `${base + 40}px`;

  // transitions
  // Apply transition timing dynamically
const counterEl = document.getElementById("test-tube-counter");
const fillEl = document.getElementById("test-tube-fill");
const topEl = document.getElementById("test-tube-fill-top");

[counterEl, fillEl, topEl].forEach(el => {
  if (!el) return;
  el.style.transition = `all ${durationSec}s ease-out`;
});


    if (date_reached) {
    const reachedDate = parseDateOnly(date_reached);

    if (reachedDate < targetDate) {
        handleEarlyReached(data);
    }
    }
}

function handleEarlyReached(data) {
  const { date_reached } = data;

  const d = parseDateOnly(date_reached);
  const formattedReached = d.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric"
  }) + "!";

  document.getElementById("test-tube-counter").classList.add("reached");

  const overEl = document.getElementById("test-tube-over");
  overEl.style.display = "block";

  overEl.querySelector("#tt-day-reached").textContent = formattedReached;

  document.getElementById("fireworks").style.display = "block";
}


document.addEventListener("DOMContentLoaded", updateTestTubeCounter);
</script>
