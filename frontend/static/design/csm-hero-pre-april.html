  <!-- HEADER - PRE-APRIL -->
         <div class="mx-auto">
        <div class="acts-hero">
            <div id="stars"></div>
            <div class="acts-hero-content ss-container mx-auto">
                <div class="acts-hero-left">
                    <div>
                        <h2 class="relative left-[6px]">Help Us Achieve</h2>
                        <h1 class="sr-only">2.50 Million Acts of Science</h1>
                        <img src="/-static/img/csm/Acts_only_number_standard.svg" alt="2.50 Million Acts of Science Logo" />
                        <div class="flex-row gap-1 md:gap-4 items-center my-8 justify-center relative sm:left-[-20px] hidden sm:flex">
                            <p class="mb-0 uppercase text-primary-dark text-sm">Official partner of</p>
                            <img src="/-static/img/csm/America250_logo.svg" alt="America 250 logo" class="w-[60px] md:w-[60px] block" />
                        </div>
                    </div>
                </div> <!-- acts hero left-->
                <div class="acts-hero-right">

                    <div>

                    <!-- TEST TUBE -->
                    <div id="test-tube">
                        <img id="test-tube-base" src="/-static/img/csm/test-tube.svg" alt="test tube data visualization">
                        <!-- max height is 370px - so 1 million == 370px, 37px per 100,000 -->
                        <!-- BUT you have to add 3px to that because of the top -->
                        <div id="test-tube-fill" style="height:3px"></div>
                        <!-- set bottom position equal to fill height plus 41px -->
                        <div id="test-tube-fill-top" style="bottom:calc(0px + 41px);"></div>
                        <div id="test-tube-scale">
                            <div class="tube-tick tick0"></div>
                            <div class="tube-tick tick1"></div>
                            <div class="tube-tick tick2"></div>
                            <div class="tube-tick tick3"></div>
                            <div class="tube-tick tick4"></div>
                            <div class="tube-tick tick5"></div>
                            <div class="tube-tick tick6"></div>
                            <div class="tube-tick tick7"></div>
                            <div class="tube-tick tick8"></div>
                            <div class="tube-tick tick9"></div>
                            <div class="tube-tick tick10"></div>
                            <div class="num tick1">0.25 M</div>
                            <div class="num tick2">0.50 M</div>
                            <div class="num tick3">0.75 M</div>
                            <div class="num tick4">1.00 M</div>
                            <div class="num tick5">1.25 M</div>
                            <div class="num tick6">1.50 M</div>
                            <div class="num tick7">1.75 M</div>
                            <div class="num tick8">2.00 M</div>
                            <div class="num tick9">2.25 M</div>
                            <div class="num tick10">2.50 M</div>
                        </div>
                        <div id="test-tube-reflect"></div>

                        <!-- same deal, 37px per 100,000 and add 10px-->
                        <div id="test-tube-counter" style="bottom:calc(80px + 0px);">
                            <div class="tt-date">Count Starts</div>
                            <div class="tt-count">April 1st</div>
                        </div>
                    </div>
                    <!-- end test tube-->

                    </div>
                                        
                </div> <!-- acts hero right -->
                
            </div>
        </div>
        </div>
        <!-- end header -->

        <!-- MOBILE ONLY 250 PARTNER-->
        <div class="flex-row gap-1 md:gap-4 items-center my-8 justify-center relative sm:left-[-20px] flex sm:hidden bg-primary-light py-4">
            <p class="mb-0 uppercase text-primary-dark text-sm">Official partner of</p>
            <img src="/-static/img/csm/America250_logo.svg" alt="America 250 logo" class="w-[60px] md:w-[60px] block" />
        </div>
