<!-- Archive Create Form -->
<div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">Create Archive Entry</h3>
    </div>

    <form method="post" action="/-admin/archive/new" class="px-6 py-6 space-y-6">
        <!-- Name -->
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Name *</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            >
        </div>

        <!-- Timestamp -->
        <div>
            <label for="timestamp" class="block text-sm font-medium text-gray-700">Timestamp *</label>
            <input
                type="datetime-local"
                id="timestamp"
                name="timestamp"
                required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            >
            <p class="mt-1 text-sm text-gray-500">The timestamp for this archive entry</p>
            <script>
                // Set default timestamp to current date and time
                (function() {
                    const timestampInput = document.getElementById('timestamp');
                    if (timestampInput && !timestampInput.value) {
                        const now = new Date();
                        const year = now.getFullYear();
                        const month = String(now.getMonth() + 1).padStart(2, '0');
                        const day = String(now.getDate()).padStart(2, '0');
                        const hours = String(now.getHours()).padStart(2, '0');
                        const minutes = String(now.getMinutes()).padStart(2, '0');
                        timestampInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                    }
                })();
            </script>
        </div>

        <!-- Notes -->
        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700">Notes</label>
            <textarea
                id="notes"
                name="notes"
                rows="4"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            ></textarea>
        </div>

        <!-- File Upload -->
        <div>
            <label for="file_upload" class="block text-sm font-medium text-gray-700">Attach File (Optional)</label>
            <input
                type="file"
                id="file_upload"
                name="file"
                hx-post="/-upload/file"
                hx-encoding="multipart/form-data"
                hx-target="#file-upload-result"
                hx-trigger="change"
                class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
            >
            <input type="hidden" id="file_id" name="file_id" value="">
            <div id="file-upload-result" class="mt-2"></div>
            <p class="mt-1 text-sm text-gray-500">Upload a file to attach to this archive entry</p>
            <script>
                // Handle file upload response
                document.body.addEventListener('htmx:afterRequest', function(evt) {
                    if (evt.detail.target.id === 'file-upload-result' && evt.detail.successful) {
                        try {
                            const response = JSON.parse(evt.detail.xhr.responseText);
                            if (response.file_id) {
                                document.getElementById('file_id').value = response.file_id;
                                document.getElementById('file-upload-result').innerHTML =
                                    '<div class="text-sm text-green-600">File uploaded successfully: ' + response.file_id + '</div>';
                            }
                        } catch (e) {
                            console.error('Failed to parse upload response:', e);
                        }
                    }
                });
            </script>
        </div>

        <!-- Snapshot URL -->
        <div>
            <label for="snapshot_url" class="block text-sm font-medium text-gray-700">Snapshot URL</label>
            <input
                type="url"
                id="snapshot_url"
                name="snapshot_url"
                placeholder="https://example.com/page"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            >
            <p class="mt-1 text-sm text-gray-500">A snapshot of this URL will be captured and stored</p>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-gray-200">
            <a
                href="/-admin/archive"
                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 no-underline"
            >
                Cancel
            </a>
            <button
                type="submit"
                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
            >
                Create Entry
            </button>
        </div>
    </form>
</div>
