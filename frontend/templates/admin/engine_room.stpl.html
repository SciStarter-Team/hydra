<!-- Operations Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <% for operation in &self.operations { %>
    <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <div class="flex items-center justify-center h-12 w-12 rounded-md bg-<%= operation.color %>-500 text-white">
                        <%- operation.icon %>
                    </div>
                </div>
                <div class="ml-4 flex-1">
                    <h3 class="text-lg font-medium text-gray-900"><%= operation.title %></h3>
                    <p class="mt-2 text-sm text-gray-600">
                        <%= operation.description %>
                    </p>
                    <div class="mt-4">
                        <button
                            hx-post="<%= operation.endpoint %>"
                            hx-target="#<%= operation.id %>-result"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-<%= operation.color %>-600 hover:bg-<%= operation.color %>-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-<%= operation.color %>-500 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <%= operation.button_text %>
                        </button>
                    </div>
                    <div id="<%= operation.id %>-result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    <% } %>
</div>

<!-- Status Messages -->
<div id="status-messages" class="mt-8"></div>
