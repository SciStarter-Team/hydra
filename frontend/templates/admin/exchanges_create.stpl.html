<div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">Create New Exchange</h3>
        <p class="mt-1 text-sm text-gray-500">Create a new white-labeled project finder exchange. Its settings are on the next page.</p>
    </div>
    <div class="p-6">
        <% if let Some(ref error) = self.error { %>
        <div class="mb-6 rounded-md bg-red-50 p-4 text-sm text-red-700"><%= error %></div>
        <% } %>
        <form method="post" action="/-admin/exchanges/create" class="space-y-6">
            <div>
                <label for="path_id" class="block text-sm font-medium text-gray-700">Path ID</label>
                <input
                    type="number"
                    name="path_id"
                    id="path_id"
                    required
                    value="<%= &self.form.path_id %>"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="Enter a unique integer ID">
                <p class="mt-1 text-sm text-gray-500">The number in the exchange's address, /exchange/&lt;path ID&gt;/</p>
            </div>

            <div>
                <label for="slug" class="block text-sm font-medium text-gray-700">Slug</label>
                <input
                    type="text"
                    name="slug"
                    id="slug"
                    required
                    pattern="[a-z0-9-]+"
                    value="<%= &self.form.slug %>"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="exchange-slug">
                <p class="mt-1 text-sm text-gray-500">Lowercase letters, numbers, and hyphens only</p>
            </div>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input
                    type="text"
                    name="name"
                    id="name"
                    required
                    value="<%= &self.form.name %>"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="Exchange Name">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea
                    name="description"
                    id="description"
                    rows="3"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="Brief description of this exchange"><%= &self.form.description %></textarea>
            </div>

            <div>
                <label for="logo_url" class="block text-sm font-medium text-gray-700">Logo URL (Optional)</label>
                <input
                    type="url"
                    name="logo_url"
                    id="logo_url"
                    value="<%= &self.form.logo_url %>"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    placeholder="https://example.com/logo.png">
            </div>

            <div class="flex justify-end space-x-3">
                <a href="/-admin/exchanges" class="inline-flex justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Cancel
                </a>
                <button
                    type="submit"
                    class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Create Exchange
                </button>
            </div>
        </form>
    </div>
</div>
