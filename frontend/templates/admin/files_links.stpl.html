<!-- Upload Section -->
<div class="bg-white shadow rounded-lg mb-8">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">Upload File</h2>
        <p class="text-sm text-gray-500">Upload a tracked file and create a go URL</p>
    </div>
    <div class="p-6">
        <form hx-post="/-upload/tracked" hx-encoding="multipart/form-data" hx-target="#upload-result">
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">File</label>
                    <input type="file" name="file" required
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Go URL Slug</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm rounded-l-md">
                            /go/
                        </span>
                        <input type="text" name="slug" required pattern="[a-zA-Z0-9-]+"
                               placeholder="my-file-slug"
                               class="flex-1 block w-full rounded-r-md border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <button type="submit"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Upload File
                    </button>
                </div>
            </div>
        </form>
        <div id="upload-result" class="mt-4"></div>
    </div>
</div>

<!-- Create Redirect Section -->
<div class="bg-white shadow rounded-lg mb-8">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">Create Redirect</h2>
        <p class="text-sm text-gray-500">Create a go URL that redirects to another URL</p>
    </div>
    <div class="p-6">
        <form hx-post="/-admin/files-links/redirect" hx-target="#go-urls-list" hx-swap="outerHTML">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Go URL Slug</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 py-2 border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm rounded-l-md">
                            /go/
                        </span>
                        <input type="text" name="slug" required pattern="[a-zA-Z0-9-]+"
                               placeholder="my-redirect-url"
                               class="flex-1 block w-full rounded-r-md border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Target URL</label>
                    <input type="url" name="target_url" required
                           placeholder="https://example.com"
                           class="block w-full rounded-md border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                        Create Redirect
                    </button>
                </div>
            </div>
        </form>
        <div id="redirect-result" class="mt-4"></div>
    </div>
</div>

<!-- Existing Go URLs -->
<div class="bg-white shadow rounded-lg">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">Existing Go URLs</h2>
        <p class="text-sm text-gray-500">Manage existing go URLs and their settings</p>
    </div>
    <div class="p-6">
        <div id="go-urls-list">
            <%+ self.go_urls_list %>
        </div>
    </div>
</div>
