<!-- New Entity Modal -->
<dialog class="rounded-lg shadow-xl w-11/12 md:w-1/2 max-h-[90vh] overflow-y-auto p-5 backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        hx-on:click="if (event.target.tagName === 'DIALOG') this.remove()">
        <div hx-on:click="event.stopPropagation()">
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-3">
            <h3 class="text-lg font-bold text-gray-900"><%= self.title %></h3>
            <button
                class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
                hx-on:click="this.closest('dialog').remove()"
            >
                <wa-icon name="x" class="w-5 h-5"></wa-icon>
            </button>
        </div>

        <!-- Message Container -->
        <div class="modal-message-container">
            <% if let Some(error) = &self.error_message { %>
                <div class="mb-4 p-3 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200">
                    <%= error %>
                </div>
            <% } %>
        </div>

        <!-- Modal Body -->
        <div class="mt-3">
            <form
                hx-post="/-admin/entities/new"
                hx-target:inherited="closest dialog"
                hx-swap:inherited="outerHTML"
            >
                <div class="grid grid-cols-1 gap-6">
                    <!-- Slug -->
                    <div>
                        <label for="slug" class="block text-sm font-medium text-gray-700 mb-2">
                            URL Slug <span class="text-red-500">*</span>
                        </label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 py-2 border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm rounded-l-md">
                                /
                            </span>
                            <input
                                type="text"
                                id="slug"
                                name="slug"
                                required
                                pattern="[a-zA-Z0-9-/]+"
                                class="flex-1 block w-full rounded-r-md border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2"
                                placeholder="my-entity-slug"
                            >
                        </div>
                        <p class="mt-1 text-xs text-gray-500">Letters, numbers, hyphens, and slashes allowed</p>
                    </div>

                    <!-- Entity Kind -->
                    <div>
                        <label for="kind" class="block text-sm font-medium text-gray-700 mb-2">
                            Entity Type <span class="text-red-500">*</span>
                        </label>
                        <select
                            id="kind"
                            name="kind"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            hx-get="/-admin/entities/target-input"
                            hx-vals='js:{"kind": this.value, "mode": "new"}'
                            hx-trigger="change"
                            hx-target="#target-input-container"
                            hx-swap="innerHTML"
                        >
                            <option value="">Select type...</option>
                            <option value="Project">Project</option>
                            <option value="Event">Event</option>
                            <option value="WordPress">WordPress Page</option>
                            <option value="Redirect">Redirect</option>
                            <option value="RawHTML">Raw HTML</option>
                            <option value="DressedHtml">Dressed HTML</option>
                            <option value="Wysiwyg">Simple Editor</option>
                            <option value="PageBuilder">Component Page</option>
                            <option value="Form">Form</option>
                        </select>
                    </div>

                    <!-- Target Input Container -->
                    <div id="target-input-container">
                        <!-- Target input will be loaded here via the select change trigger -->
                        <div>
                            <label for="target" class="block text-sm font-medium text-gray-700 mb-2">
                                Target (Optional)
                            </label>
                            <input
                                type="text"
                                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                placeholder="Select entity type first"
                                disabled
                            >
                            <p class="mt-1 text-xs text-gray-500">Leave blank to create placeholder - can be set later</p>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="flex items-center justify-end pt-6 space-x-2">
                    <button
                        type="button"
                        class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300"
                        hx-on:click="this.closest('dialog').remove()"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="relative px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <span>Create Entity</span>
                    </button>
                </div>
            </form>
        </div>
        </div>
</dialog>
