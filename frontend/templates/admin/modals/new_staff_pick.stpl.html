<!-- New Staff Pick Modal -->
<dialog data-notifications class="rounded-lg shadow-xl w-11/12 md:w-3/4 max-h-[90vh] overflow-y-auto p-5 backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        hx-on:click="if (event.target.tagName === 'DIALOG') this.remove()">
    <div hx-on:click="event.stopPropagation()">
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-3">
            <h3 class="text-lg font-bold text-gray-900">Add Staff Pick</h3>
            <button
                class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
                hx-on:click="this.closest('dialog').remove()"
            >
                <wa-icon name="x" class="w-5 h-5"></wa-icon>
            </button>
        </div>

        <!-- Message Container -->
        <% if let Some(error) = &self.error_message { %>
            <div class="mb-4 p-3 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200">
                <%= error %>
            </div>
        <% } %>

        <!-- Modal Body -->
        <div class="mt-3">
            <form
                hx-post="/-admin/staff-picks"
                hx-target="closest dialog"
                hx-swap="outerHTML"
            >
                <div class="grid grid-cols-1 gap-6">
                    <!-- Project Slug -->
                    <div>
                        <label for="project_slug" class="block text-sm font-medium text-gray-700 mb-2">
                            Project Slug <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="project_slug"
                            name="project_slug"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="e.g. globe-observer"
                        >
                    </div>

                    <!-- Label -->
                    <div>
                        <label for="label" class="block text-sm font-medium text-gray-700 mb-2">
                            Display Name
                        </label>
                        <input
                            type="text"
                            id="label"
                            name="label"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="Display name for the project"
                        >
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                            Description
                        </label>
                        <textarea
                            id="description"
                            name="description"
                            rows="3"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="Brief description of the project"
                        ></textarea>
                    </div>

                    <!-- Location -->
                    <div>
                        <label for="location" class="block text-sm font-medium text-gray-700 mb-2">
                            Location
                        </label>
                        <input
                            type="text"
                            id="location"
                            name="location"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="e.g. Anywhere, Outdoors"
                        >
                    </div>

                    <!-- Acts Per Hour -->
                    <div>
                        <label for="acts_per_hour" class="block text-sm font-medium text-gray-700 mb-2">
                            Estimated Time to Act
                        </label>
                        <input
                            type="text"
                            id="acts_per_hour"
                            name="acts_per_hour"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="e.g. 15 minutes"
                        >
                    </div>

                    <!-- Picker Name -->
                    <div>
                        <label for="picker_name" class="block text-sm font-medium text-gray-700 mb-2">
                            Picker Name <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="picker_name"
                            name="picker_name"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="Name of the person who picked this project"
                        >
                    </div>

                    <!-- Picker Image -->
                    <div>
                        <label for="picker_image" class="block text-sm font-medium text-gray-700 mb-2">
                            Picker Image Path
                        </label>
                        <input
                            type="text"
                            id="picker_image"
                            name="picker_image"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="Path on media.scistarter.org"
                        >
                    </div>

                    <!-- Picker Quote -->
                    <div>
                        <label for="picker_quote" class="block text-sm font-medium text-gray-700 mb-2">
                            Picker Quote
                        </label>
                        <textarea
                            id="picker_quote"
                            name="picker_quote"
                            rows="2"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            placeholder="Why did they pick this project?"
                        ></textarea>
                    </div>

                    <!-- Priority -->
                    <div>
                        <label for="priority" class="block text-sm font-medium text-gray-700 mb-2">
                            Priority
                        </label>
                        <input
                            type="number"
                            id="priority"
                            name="priority"
                            value="0"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        >
                        <p class="mt-1 text-sm text-gray-500">Higher numbers appear first.</p>
                    </div>

                    <!-- Date Range -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <wa-input type="date" id="begin_date" label="Begin Date" name="begin_date" required></wa-input>
                        </div>
                        <div>
                            <wa-input type="date" id="end_date" label="End Date" name="end_date" required></wa-input>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="flex items-center justify-end pt-6 space-x-2">
                    <button
                        type="button"
                        class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300"
                        hx-on:click="this.closest('dialog').remove()"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="relative px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <span>Create</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</dialog>
