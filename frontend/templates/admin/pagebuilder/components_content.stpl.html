<% if self.components.is_empty() { %>
<div class="p-8 text-center">
    <wa-icon name="puzzle-piece" class="mx-auto h-12 w-12 text-gray-400"></wa-icon>
    <h3 class="mt-2 text-sm font-medium text-gray-900">No components found</h3>
    <p class="mt-1 text-sm text-gray-500">Try adjusting your search or filter.</p>
</div>
<% } else { %>
<ul class="divide-y divide-gray-200">
    <% for component in &self.components { %>
    <%+ PbComponentRow { component } %>
    <% } %>
</ul>
<% } %>
