<div class="max-w-4xl mx-auto py-8">
    <div class="bg-white shadow rounded-lg">
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <a href="/-admin/component-pages" class="text-gray-500 hover:text-gray-700">
                    <wa-icon name="arrow-left" class="w-5 h-5"></wa-icon>
                </a>
                <div>
                    <h1 class="text-lg font-semibold text-gray-900"><%= &self.page.name %></h1>
                    <% if !self.page.description.is_empty() { %>
                    <p class="text-sm text-gray-500"><%= &self.page.description %></p>
                    <% } %>
                </div>
            </div>
        </div>

        <div class="p-6">
            <div class="rounded-md bg-red-50 border border-red-200 p-4 mb-6">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <wa-icon name="exclamation-triangle" class="h-5 w-5 text-red-400"></wa-icon>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Template Error</h3>
                        <p class="mt-1 text-sm text-red-700">
                            This page contains invalid template syntax and cannot be rendered.
                            Please fix the error below and save to continue editing.
                        </p>
                        <pre class="mt-3 p-3 bg-red-100 border border-red-200 rounded text-sm text-red-800 overflow-x-auto whitespace-pre-wrap"><%= &self.error_message %></pre>
                    </div>
                </div>
            </div>

            <form method="POST"
                  action="/-admin/component-pages/<%= self.page.page_id|disp %>/source"
                  hx-post="/-admin/component-pages/<%= self.page.page_id|disp %>/source"
                  class="space-y-4">

                <div>
                    <label for="source" class="block text-sm font-medium text-gray-700 mb-2">
                        Page Source
                    </label>
                    <textarea id="source"
                              name="source"
                              rows="25"
                              required
                              class="block w-full px-3 py-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 font-mono text-sm"><%= &self.page.source %></textarea>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                    <div class="flex gap-3">
                        <a href="/-admin/component-pages"
                           class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                            Back to Pages
                        </a>
                        <button type="button"
                                hx-delete="/-admin/component-pages/<%= self.page.page_id|disp %>"
                                hx-confirm="Are you sure you want to delete this page? This cannot be undone."
                                class="inline-flex items-center px-4 py-2 border border-red-300 rounded-md shadow-sm text-sm font-medium text-red-700 bg-white hover:bg-red-50">
                            <wa-icon name="trash" class="w-4 h-4 mr-2"></wa-icon>
                            Delete Page
                        </button>
                    </div>
                    <button type="submit"
                            class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <wa-icon name="check" class="w-4 h-4 mr-2"></wa-icon>
                        Save and Retry
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
