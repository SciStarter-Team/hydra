<dialog hx-indicator:inherited="closest dialog" data-notifications class="rounded-lg shadow-xl max-w-lg w-full p-6 backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        onclick="if (event.target === this) this.remove()">
    <div>
        <div class="flex items-start">
            <div class="flex-shrink-0 text-red-500">
                <wa-icon name="exclamation-circle" class="w-6 h-6"></wa-icon>
            </div>
            <div class="ml-3">
                <h3 class="text-lg font-medium text-gray-900">
                    Template Syntax Error
                </h3>
                <p class="mt-2 text-sm text-gray-600">
                    The component template could not be saved because it contains invalid syntax:
                </p>
                <pre class="mt-3 p-3 bg-red-50 border border-red-200 rounded text-sm text-red-800 overflow-x-auto"><%= &self.message %></pre>
                <p class="mt-3 text-sm text-gray-500">
                    Please fix the syntax error and try again.
                </p>
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <button onclick="this.closest('dialog').remove()"
                    type="button"
                    class="inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Close
            </button>
        </div>
    </div>
</dialog>
