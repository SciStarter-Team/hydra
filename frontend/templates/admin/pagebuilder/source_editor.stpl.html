<div class="max-w-4xl mx-auto py-8">
    <div class="bg-white shadow rounded-lg">
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <a href="/-admin/component-pages/<%= self.page.page_id|disp %>" class="text-gray-500 hover:text-gray-700">
                        <wa-icon name="arrow-left" class="w-5 h-5"></wa-icon>
                    </a>
                    <div>
                        <h1 class="text-lg font-semibold text-gray-900"><%= &self.page.name %></h1>
                        <p class="text-sm text-gray-500">Edit page source</p>
                    </div>
                </div>
            </div>
        </div>

        <form method="POST"
              action="/-admin/component-pages/<%= self.page.page_id|disp %>/source"
              hx-post="/-admin/component-pages/<%= self.page.page_id|disp %>/source"
              class="p-6 space-y-4">

            <div>
                <label for="source" class="block text-sm font-medium text-gray-700 mb-2">
                    Page Source
                </label>
                <textarea id="source"
                          name="source"
                          rows="30"
                          required
                          class="block w-full px-3 py-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 font-mono text-sm"><%= &self.page.source %></textarea>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                <a href="/-admin/component-pages/<%= self.page.page_id|disp %>"
                   class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <wa-icon name="check" class="w-4 h-4 mr-2"></wa-icon>
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
