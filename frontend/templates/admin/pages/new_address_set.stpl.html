<div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">New Address Set</h3>
    </div>

    <form method="POST" action="/-admin/email/address-sets/new" class="p-6 space-y-6">
        <% if let Some(error) = &self.error_message { %>
            <div class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <wa-icon name="x-circle" class="h-5 w-5 text-red-400"></wa-icon>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800"><%= error %></h3>
                    </div>
                </div>
            </div>
        <% } %>

        <div>
            <label for="slug" class="block text-sm font-medium text-gray-700">Slug</label>
            <input
                type="text"
                name="slug"
                id="slug"
                required
                pattern="[a-z0-9_-]+"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                placeholder="my-address-set"
            />
            <p class="mt-1 text-sm text-gray-500">Lowercase letters, numbers, hyphens, and underscores only</p>
        </div>

        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
            <input
                type="text"
                name="name"
                id="name"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                placeholder="My Address Set"
            />
        </div>

        <div class="flex justify-end gap-3">
            <a
                href="/-admin/email/address-sets"
                class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
            >
                Cancel
            </a>
            <button
                type="submit"
                class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
            >
                Create Address Set
            </button>
        </div>
    </form>
</div>
