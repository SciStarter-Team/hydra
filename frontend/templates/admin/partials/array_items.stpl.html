<div id="array-items-<%= self.project_id|disp %>-<%= self.field_type|disp %>" class="space-y-2">
    <% for (index, item) in self.items.iter().enumerate() { %>
        <div class="flex items-center space-x-2 p-2 bg-gray-50 rounded">
            <input type="text"
                   value="<%= item %>"
                   class="flex-1 px-2 py-1 border border-gray-300 rounded text-sm"
                   hx-put="/-admin/projects/<%= self.project_id|disp %>/array/<%= self.field_type|disp %>/items/<%= index %>"
                   hx-trigger="blur"
                   hx-target="#array-items-<%= self.project_id|disp %>-<%= self.field_type|disp %>"
                   hx-include="this"
                   name="value" />
            <button type="button"
                    class="px-2 py-1 text-xs bg-red-500 text-white rounded hover:bg-red-600"
                    hx-delete="/-admin/projects/<%= self.project_id|disp %>/array/<%= self.field_type|disp %>/items/<%= index %>"
                    hx-target="#array-items-<%= self.project_id|disp %>-<%= self.field_type|disp %>"
                    hx-confirm="Are you sure you want to remove this item?">
                Remove
            </button>
        </div>
    <% } %>

    <!-- Add new item form -->
    <div class="flex items-center space-x-2 p-2 bg-blue-50 rounded">
        <input type="text"
               placeholder="Add new item..."
               class="flex-1 px-2 py-1 border border-gray-300 rounded text-sm"
               name="value" />
        <button type="button"
                class="px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600"
                hx-post="/-admin/projects/<%= self.project_id|disp %>/array/<%= self.field_type|disp %>/items"
                hx-target="#array-items-<%= self.project_id|disp %>-<%= self.field_type|disp %>"
                hx-include="previous input">
            Add
        </button>
    </div>
</div>
