<div id="criterion-fields" class="space-y-4">
    <%+ self.widget %>
    <div>
        <label for="start" class="block text-sm font-medium text-gray-700">Start Date</label>
        <input
            type="date"
            name="start"
            id="start"
            required
            class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
    </div>
    <div>
        <label for="end" class="block text-sm font-medium text-gray-700">End Date</label>
        <input
            type="date"
            name="end"
            id="end"
            required
            class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
    </div>
</div>
