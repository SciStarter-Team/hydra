<div id="explicit-list-widget" class="space-y-2">
    <% for (user_id, email) in &self.user_names { %>
        <div class="flex items-center space-x-2 p-2 bg-gray-50 rounded">
            <span class="flex-1 text-sm text-gray-900"><%= email %> <span class="text-xs text-gray-500"><%= user_id|disp %></span></span>
            <input type="hidden" name="user_ids[]" value="<%= user_id|disp %>" />
            <button
                type="button"
                class="px-2 py-1 text-xs bg-red-500 text-white rounded hover:bg-red-600"
                hx-delete="/-admin/email/user-sets/explicit-list-widget/<%= user_id|disp %>"
                hx-target="#explicit-list-widget"
                hx-include="[name='user_ids[]']"
            >
                Remove
            </button>
        </div>
    <% } %>
    <div class="flex items-center space-x-2 p-2 bg-blue-50 rounded">
        <%+ self.widget %>
        <button
            type="button"
            class="px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600"
            hx-post="/-admin/email/user-sets/explicit-list-widget"
            hx-target="#explicit-list-widget"
            hx-include="[name='user_ids[]'], [data-part=storage]"
        >
            Add
        </button>
    </div>
</div>
