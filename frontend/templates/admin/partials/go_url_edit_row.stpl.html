<div id="go-url-<%= self.slug %>" class="border border-blue-300 bg-blue-50 rounded-lg p-4">
    <form hx-post="/-admin/files-links/<%= self.slug %>"
          hx-target="#go-url-<%= self.slug %>" hx-swap="outerHTML"
          class="flex flex-col lg:flex-row lg:items-center gap-3">
        <div>
            <code class="bg-gray-100 px-2 py-1 rounded text-sm">/go/<%= self.slug %></code>
        </div>
        <div class="flex-1">
            <label class="sr-only" for="target-url-<%= self.slug %>">Target URL</label>
            <%# The pattern mirrors GoUrl::is_valid_target; the server checks it too. %>
            <input type="text" id="target-url-<%= self.slug %>" name="target_url" required
                   pattern="/([^/].*)?|[A-Za-z][A-Za-z0-9+.\-]*:.*"
                   title="Start with a scheme (https://, mailto:) or with / for a path on this site"
                   value="<%= self.target_url %>"
                   class="block w-full text-sm rounded-md border-gray-300 focus:border-blue-500 focus:ring-blue-500">
        </div>
        <div class="flex items-center gap-2">
            <button type="submit"
                    class="px-3 py-1 text-sm rounded-md bg-blue-600 text-white hover:bg-blue-700">
                Save
            </button>
            <button type="button"
                    hx-get="/-admin/files-links/<%= self.slug %>/row"
                    hx-target="#go-url-<%= self.slug %>" hx-swap="outerHTML"
                    class="px-3 py-1 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-100">
                Cancel
            </button>
        </div>
    </form>
    <p class="mt-2 text-xs text-gray-500">
        The slug is this link's identifier and cannot be changed here &mdash; delete and recreate to rename it.
        Editing the target only overrides orrery until the same link is changed there.
    </p>
</div>
