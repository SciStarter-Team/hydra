<div id="merge-fields-unresolvable-warning" class="col-span-2 hidden p-3 text-sm text-amber-800 bg-amber-50 rounded-lg border border-amber-200">
    <div class="flex items-start">
        <svg class="w-5 h-5 text-amber-500 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
        <div>
            <span class="font-medium">Unresolvable merge fields: </span>
            <span id="merge-fields-unresolvable-list"></span>
            <div class="mt-1 text-amber-700">These fields are not in the selected data sets. If this message is triggered, they might be provided by the trigger.</div>
        </div>
    </div>
</div>
<% if self.fields.is_empty() { %>
    <p class="text-sm text-gray-500 italic col-span-2">Select data sets above to see available merge fields</p>
<% } else { %>
    <% for field in &self.fields { %>
        <button
            type="button"
            class="merge-field-btn text-left px-3 py-2 bg-gray-50 hover:bg-indigo-50 border border-gray-300 hover:border-indigo-400 rounded text-sm transition-colors"
            data-field-name="<%= field.name %>"
            hx-on:click="insertMergeField('<%= field.name %>', event)"
            title="<%= field.description %>"
        >
            <div class="font-mono text-indigo-600">{{<%= field.name %>}}</div>
            <div class="text-xs text-gray-500 mt-1"><%= field.example %></div>
        </button>
    <% } %>
<% } %>
<script>
(function() {
    var available = new Set();
    document.querySelectorAll('#merge-fields-list .merge-field-btn').forEach(function(btn) {
        available.add(btn.dataset.fieldName);
    });
    available.add('UNSUBSCRIBE_URL');
    available.add('OPEN_TRACKING_URL');

    var editor = document.querySelector('ss-rich-text');
    if (!editor || !editor.quill) return;

    // Scan the full delta JSON to catch merge fields in both text and link URLs
    var deltaStr = JSON.stringify(editor.quill.getContents());
    var re = /\{\{([A-Za-z_][A-Za-z0-9_]*)\}\}/g;
    var unresolvable = [];
    var seen = new Set();
    var match;
    while ((match = re.exec(deltaStr)) !== null) {
        if (!available.has(match[1]) && !seen.has(match[1])) {
            seen.add(match[1]);
            unresolvable.push(match[1]);
        }
    }

    // Also check the subject field
    var subject = document.querySelector('input[name="subject"]');
    if (subject) {
        re.lastIndex = 0;
        while ((match = re.exec(subject.value)) !== null) {
            if (!available.has(match[1]) && !seen.has(match[1])) {
                seen.add(match[1]);
                unresolvable.push(match[1]);
            }
        }
    }

    var warning = document.getElementById('merge-fields-unresolvable-warning');
    if (unresolvable.length > 0) {
        var list = document.getElementById('merge-fields-unresolvable-list');
        list.innerHTML = unresolvable.map(function(f) {
            return '<code class="px-1 py-0.5 bg-amber-100 rounded text-amber-900">{{' + f + '}}</code>';
        }).join(', ');
        warning.classList.remove('hidden');
    } else {
        warning.classList.add('hidden');
    }
})();
</script>
