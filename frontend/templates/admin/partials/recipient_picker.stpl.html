<!-- Recipient Picker Component -->
<div>
    <label for="recipient-search" class="block text-sm font-medium text-gray-700 mb-2">
        Recipients
    </label>
    <p class="text-sm text-gray-500 mb-3">
        Search for users, user sets, address sets, or enter an email address
    </p>

    <!-- Selected Recipients -->
    <div id="selected-recipients" class="mb-3 flex flex-wrap gap-2">
        <!-- Selected recipients will be added here via hx-swap-oob -->
    </div>

    <!-- Search Input -->
    <div class="relative">
        <input
            type="text"
            id="recipient-search"
            name="q"
            hx-get="/-admin/api/recipient-search"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#recipient-search-results"
            hx-include="this"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="Search for recipients..."
            autocomplete="off"
        >

        <!-- Search Results Dropdown -->
        <div id="recipient-search-results">
            <!-- Results will be loaded here -->
        </div>
    </div>

    <!-- Hidden inputs for selected recipients -->
    <div id="recipient-inputs">
        <!-- Hidden inputs will be added here for form submission via hx-swap-oob -->
    </div>
</div>
