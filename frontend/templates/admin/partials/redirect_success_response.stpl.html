<div class="p-3 bg-green-100 border border-green-300 rounded-md">
    <div class="flex">
        <wa-icon name="check-circle" class="w-5 h-5 text-green-500 mr-2 mt-0.5"></wa-icon>
        <div class="text-sm text-green-700">
            Redirect created successfully for <code>/go/<%= self.slug %></code>
        </div>
    </div>
</div>
<div id="go-urls-results" hx-swap-oob="outerHTML"><%+ self.go_urls_list %></div>
<input id="redirect-slug" type="text" name="slug" required pattern="[a-zA-Z0-9-]+" placeholder="my-redirect-url" value="" class="flex-1 block w-full rounded-r-md border border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2" hx-swap-oob="outerHTML">
<input id="redirect-target" type="url" name="target_url" required placeholder="https://example.com" value="" class="block w-full rounded-md border border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2" hx-swap-oob="outerHTML">
