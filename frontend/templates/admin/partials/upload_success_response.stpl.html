<div class="p-3 bg-green-100 border border-green-300 rounded-md">
    <div class="flex">
        <wa-icon name="check-circle" class="w-5 h-5 text-green-500 mr-2 mt-0.5"></wa-icon>
        <div class="text-sm text-green-700">
            File uploaded successfully and go URL created for <code>/go/<%= self.slug %></code>
            <div class="text-xs text-green-600 mt-1">File ID: <%= self.file_id|disp %></div>
        </div>
    </div>
</div>
<div id="go-urls-results" hx-swap-oob="outerHTML"><%+ self.go_urls_list %></div>
<input id="upload-file" type="file" name="file" required value="" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" hx-swap-oob="outerHTML">
<input id="upload-slug" type="text" name="slug" required pattern="[a-zA-Z0-9-]+" placeholder="my-file-slug" value="" class="flex-1 block w-full rounded-r-md border border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2" hx-swap-oob="outerHTML">
