<div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">Add Phrase</h3>
        <p class="mt-1 text-sm text-gray-500">
            For translating text before the site starts displaying it. The phrase has to match
            the source exactly, character for character, or the site will treat it as a
            different phrase and go on showing English.
        </p>
    </div>

    <div class="p-6">
        <% if let Some(error) = &self.error { %>
            <p class="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded-md text-sm text-red-700">
                <%= error %>
            </p>
        <% } %>

        <form method="post" action="/-admin/translations/new">
            <div class="mb-6">
                <label for="source" class="block text-sm font-medium text-gray-700 mb-2">
                    English text
                </label>
                <textarea name="source" id="source" rows="4" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"></textarea>
            </div>

            <div class="mb-6">
                <label for="context" class="block text-sm font-medium text-gray-700 mb-2">
                    Context <span class="font-normal text-gray-500">(optional)</span>
                </label>
                <input type="text" name="context" id="context"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"
                       placeholder="only if these same words need a different translation elsewhere">
            </div>

            <div class="flex items-center justify-end space-x-2 pt-6 border-t border-gray-200">
                <a href="/-admin/translations"
                   class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400">
                    Cancel
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700">
                    Add Phrase
                </button>
            </div>
        </form>
    </div>
</div>
