<div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
        <h3 class="text-lg font-medium text-gray-900">User Sets</h3>
        <a
            href="/-admin/email/user-sets/new"
            class="relative inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
        >
            <span class="inline-flex items-center">
                <wa-icon name="plus" class="w-4 h-4 mr-2"></wa-icon>
                Create User Set
            </span>
        </a>
    </div>

    <% if self.user_sets.is_empty() { %>
        <div class="p-12 text-center">
            <wa-icon name="users" class="mx-auto h-12 w-12 text-gray-400"></wa-icon>
            <h3 class="mt-2 text-sm font-medium text-gray-900">No user sets</h3>
            <p class="mt-1 text-sm text-gray-500">Get started by creating a new user set.</p>
            <div class="mt-6">
                <a
                    href="/-admin/email/user-sets/new"
                    class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                    <wa-icon name="plus" class="w-4 h-4 mr-2"></wa-icon>
                    New User Set
                </a>
            </div>
        </div>
    <% } else { %>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Slug</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                        <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="user-sets-table">
                    <% for user_set in &self.user_sets { %>
                        <tr class="hover:bg-gray-50" id="user-set-<%= user_set.slug %>">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                <%= user_set.slug %>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <%= user_set.name %>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <%= user_set.created_at %>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <div class="flex items-center justify-end space-x-2">
                                    <a
                                        href="/-admin/email/user-sets/<%= user_set.slug %>"
                                        class="text-indigo-600 hover:text-indigo-900 transition-colors no-underline"
                                    >
                                        <wa-icon name="pencil" class="w-4 h-4"></wa-icon>
                                    </a>
                                    <button
                                        hx-delete="/-admin/email/user-sets/<%= user_set.slug %>"
                                        hx-confirm="Are you sure you want to delete this user set?"
                                        hx-target="#user-set-<%= user_set.slug %>"
                                        hx-swap="outerHTML swap:1s"
                                        class="text-red-600 hover:text-red-900 transition-colors"
                                    >
                                        <wa-icon name="trash" class="w-4 h-4"></wa-icon>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    <% } %>
                </tbody>
            </table>
        </div>
    <% } %>
</div>
