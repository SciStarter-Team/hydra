<div class="webinar-link-row grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
    <div class="sm:col-span-3">
        <select
            name="link_kind[]"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
        >
            <% for kind in self.link_kinds { %>
                <option value="<%= kind|disp %>" <% if *kind == self.link.kind { %>selected<% } %>><%= kind|disp %></option>
            <% } %>
        </select>
    </div>
    <div class="sm:col-span-3">
        <input
            type="text"
            name="link_label[]"
            value="<%= self.link.label %>"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="e.g. 6 PM ET"
        >
    </div>
    <div class="sm:col-span-5">
        <input
            type="url"
            name="link_url[]"
            value="<%= self.link.url %>"
            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="https://..."
        >
    </div>
    <div class="sm:col-span-1 flex sm:justify-end">
        <button
            type="button"
            class="text-red-600 hover:text-red-900 transition-colors"
            hx-on:click="this.closest('.webinar-link-row').remove()"
        >
            <wa-icon name="trash" class="w-4 h-4"></wa-icon>
        </button>
    </div>
</div>
