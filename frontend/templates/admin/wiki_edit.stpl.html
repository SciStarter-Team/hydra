<div class="wiki-edit-card bg-white rounded-lg shadow border border-gray-200">
    <!-- Page Header -->
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900"><% if self.is_new { %>Create<% } else { %>Edit<% } %> Wiki Page: <%= self.title %></h3>
        <p class="mt-1 text-sm text-gray-500">Use [Page Name] to create links to other wiki pages</p>
    </div>

    <!-- Page Body -->
    <div class="p-6">
        <form method="post" action="/-admin/wiki/<%= urlencoding::encode(&self.title) %>">
            <!-- Content Editor -->
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
                    Content
                </label>
                <ss-rich-text
                    name="content"
                    value='<%= self.content %>'
                    placeholder="Start typing... Use [Page Name] for wiki links">
                </ss-rich-text>
            </div>

            <!-- Form Footer -->
            <div class="flex items-center justify-between pt-6 border-t border-gray-200 mt-6">
                <% if !self.is_new { %>
                <button
                    type="button"
                    hx-delete="/-admin/wiki/<%= urlencoding::encode(&self.title) %>"
                    hx-confirm="Are you sure you want to delete this wiki page? This action cannot be undone."
                    hx-target="closest .wiki-edit-card"
                    hx-swap="outerHTML"
                    class="px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">
                    Delete Page
                </button>
                <% } else { %>
                <div></div>
                <% } %>
                <div class="flex space-x-2">
                    <a href="/-admin/wiki/<%= urlencoding::encode(&self.title) %>"
                       class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        Cancel
                    </a>
                    <button
                        type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <% if self.is_new { %>Create Page<% } else { %>Save Changes<% } %>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
