<!-- FLOWER, THE AI CONCIERGE -->
<div class="home-concierge ss-container my-8">
  <h2 class="header-underlined font-header-lg font-bold text-primary-dark mb-6"><%= self.heading %></h2>
  <div class="ss-card !p-4">
    <div id="concierge-log" class="flex flex-col gap-3 max-h-96 overflow-y-auto"
         hx-on::after-swap="this.scrollTop = this.scrollHeight">
      <div class="flex items-end gap-2 self-start max-w-[85%]">
        <img src="/-static/img/concierge/flower-avatar.jpg" alt="Flower, a scruffy golden dog" class="w-9 h-9 rounded-full shrink-0" />
        <div class="concierge-msg rounded-lg bg-gray-100 p-3 text-sm whitespace-pre-line">Hi, I&rsquo;m Flower! 🐾 Tell me what you&rsquo;re curious about &mdash; animals, the night sky, your neighborhood creek, anything &mdash; and I&rsquo;ll sniff out real science projects you can join.</div>
      </div>
    </div>
    <%+ self.form %>
  </div>
</div>
