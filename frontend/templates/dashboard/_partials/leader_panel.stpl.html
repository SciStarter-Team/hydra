<section class="grid grid-cols-2 gap-4 mb-6">
    <div class="ss-card !p-4">
        <div class="text-3xl font-bold"><%= self.owned_projects_count %></div>
        <div class="text-xs opacity-70">Projects you own</div>
    </div>
    <div class="ss-card !p-4">
        <div class="text-3xl font-bold"><%= self.owned_events_count %></div>
        <div class="text-xs opacity-70">Events you've created</div>
    </div>
</section>

<details class="ss-accordion-accessible border border-linework rounded-sm bg-primary-light mb-4" open>
    <summary class="accordion__summary !flex justify-between items-center text-lg p-4 m-0 text-primary-dark">
        <span>Owned Projects <span class="text-sm opacity-70">— projects you created</span></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-4 fill-primary-action"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg>
    </summary>
    <div class="accordion__panel bg-white p-4">
        <%+ self.projects %>
    </div>
</details>

<details class="ss-accordion-accessible border border-linework rounded-sm bg-primary-light mb-4">
    <summary class="accordion__summary !flex justify-between items-center text-lg p-4 m-0 text-primary-dark">
        <span>Owned Events <span class="text-sm opacity-70">— events you created</span></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-4 fill-primary-action"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg>
    </summary>
    <div class="accordion__panel bg-white p-4">
        <%+ self.events %>
    </div>
</details>
