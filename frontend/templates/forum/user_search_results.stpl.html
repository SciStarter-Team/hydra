<div class="user-search-results">
    <% for user in self.users { %>
        <div class="user-search-result" 
             data-user-id="<%= user.user_id|disp %>"
             data-user-handle="<%= user.handle %>"
             hx-on:click="htmx.find('#selected-user-id').value = '<%= user.user_id|disp %>';
                          htmx.find('#user-search').value = '';
                          htmx.find('#user-search-results').replaceChildren();"
             style="cursor: pointer;">
            <div class="user-info">
                <strong><%= user.display_handle() %></strong>
                <small>ID: <%= user.user_id|disp %></small>
            </div>
        </div>
    <% } %>
</div>
