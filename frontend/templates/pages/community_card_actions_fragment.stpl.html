<% if self.community.exclusive { %>
<% if self.is_member { %>
<span id="community-actions-<%= self.community.slug %>" class="text-sm italic text-gray-600">Member</span>
<% } else { %>
<span id="community-actions-<%= self.community.slug %>"></span>
<% } %>
<% } else if self.is_member { %>
<button class="btn btn-secondary btn-icon" id="community-actions-<%= self.community.slug %>"
        hx-post="/communities/<%= self.community.slug %>/leave?context=card"
        hx-target="#community-actions-<%= self.community.slug %>"
        hx-swap="outerHTML">
    <span>Leave</span>
</button>
<% } else { %>
<button class="btn btn-primary btn-icon" id="community-actions-<%= self.community.slug %>"
        hx-post="/communities/<%= self.community.slug %>/join?context=card"
        hx-target="#community-actions-<%= self.community.slug %>"
        hx-swap="outerHTML">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="m256 0c-141.164062 0-256 114.835938-256 256s114.835938 256 256 256 256-114.835938 256-256-114.835938-256-256-256zm112 277.332031h-90.667969v90.667969c0 11.777344-9.554687 21.332031-21.332031 21.332031s-21.332031-9.554687-21.332031-21.332031v-90.667969h-90.667969c-11.777344 0-21.332031-9.554687-21.332031-21.332031s9.554687-21.332031 21.332031-21.332031h90.667969v-90.667969c0-11.777344 9.554687-21.332031 21.332031-21.332031s21.332031 9.554687 21.332031 21.332031v90.667969h90.667969c11.777344 0 21.332031 9.554687 21.332031 21.332031s-9.554687 21.332031-21.332031 21.332031zm0 0"></path></svg>
    <span>Join</span>
</button>
<% } %>
