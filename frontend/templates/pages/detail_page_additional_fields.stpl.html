<details class="ss-accordion-accessible border border-linework rounded-sm bg-primary-light mb-4">
  <summary class="accordion__summary !flex justify-between text-lg p-4 m-0 text-primary-dark">
    Additional Fields
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-4 fill-primary-action"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg>
  </summary>
  <div class="accordion__panel p-4 space-y-2">
    <% for field in &self.fields { %>
    <div id="field-<%= &field.field_type %>" class="relative flex items-start gap-2 py-1 border-b border-linework last:border-0">
      <span class="text-xs font-semibold text-gray-600 min-w-[140px]"><%= &field.label %></span>
      <span class="text-sm flex-1"><% if field.current_value.is_empty() { %><span class="text-gray-400 italic">(not set)</span><% } else { %><%= &field.current_value %><% } %></span>
      <button class="p-1 opacity-40 hover:opacity-100 cursor-pointer shrink-0"
              title="Edit <%= &field.label %>"
              hx-get="/-detail/<%= &self.target_id %>/field/<%= &field.field_type %>"
              hx-target="#field-<%= &field.field_type %>"
              hx-swap="outerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-3 h-3 fill-gray-500"><path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1 0 32c0 8.8 7.2 16 16 16l32 0zM362.7 18.7L348.3 33.2 420.2 105.1 434.7 90.6c0 0 0 0 0 0L462.5 62.8c4-4 6.2-9.2 6.7-14.6l.3-3.9c.4-5.5-1.3-11-4.8-15.4-3.3-4.2-7.9-7-13.1-7.8l-3.9-.6c-5.5-.8-11.1 .6-15.4 3.9L409.7 42.6 362.7 18.7z"/></svg>
      </button>
    </div>
    <% } %>
  </div>
</details>
