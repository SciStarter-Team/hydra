<div id="event-instances">
  <ul class="space-y-2">
    <% for (i, instance) in self.instances.iter().enumerate() { %>
    <li class="flex items-center gap-2 group" id="instance-row-<%= i %>">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-4 h-4 fill-primary-action shrink-0"><path d="M152 24c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L64 64C28.7 64 0 92.7 0 128l0 16 0 48L0 448c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-256 0-48 0-16c0-35.3-28.7-64-64-64l-40 0 0-40c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L152 64l0-40zM48 192l352 0 0 256c0 8.8-7.2 16-16 16L64 464c-8.8 0-16-7.2-16-16l0-256z"/></svg>
      <span><%- local_time(&instance.begin, TimeFormat::DateTime) %> – <%- local_time(&instance.end, TimeFormat::DateTime) %></span>
      <% if self.can_edit { %>
      <button class="p-1 opacity-0 group-hover:opacity-60 hover:!opacity-100 cursor-pointer"
              title="Edit instance"
              hx-get="/-detail/<%= &self.target_id %>/instances/<%= i %>/edit"
              hx-target="#instance-row-<%= i %>"
              hx-swap="outerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-3 h-3 fill-gray-500"><path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1 0 32c0 8.8 7.2 16 16 16l32 0zM362.7 18.7L348.3 33.2 420.2 105.1 434.7 90.6c0 0 0 0 0 0L462.5 62.8c4-4 6.2-9.2 6.7-14.6l.3-3.9c.4-5.5-1.3-11-4.8-15.4-3.3-4.2-7.9-7-13.1-7.8l-3.9-.6c-5.5-.8-11.1 .6-15.4 3.9L409.7 42.6 362.7 18.7z"/></svg>
      </button>
      <button class="p-1 opacity-0 group-hover:opacity-60 hover:!opacity-100 cursor-pointer"
              title="Remove instance"
              hx-delete="/-detail/<%= &self.target_id %>/instances/<%= i %>"
              hx-target="#event-instances"
              hx-swap="outerHTML"
              hx-confirm="Remove this instance?">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="w-3 h-3 fill-red-400"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
      <% } %>
    </li>
    <% } %>
  </ul>
  <% if self.can_edit { %>
  <details class="mt-3">
    <summary class="btn btn-secondary btn-xs cursor-pointer">Add instance</summary>
    <form class="mt-2 p-3 border border-blue-300 rounded-sm bg-blue-50"
          hx-post="/-detail/<%= &self.target_id %>/instances"
          hx-target="#event-instances"
          hx-swap="outerHTML">
      <div class="flex gap-2 items-end flex-wrap">
        <div>
          <label class="block text-xs font-semibold mb-1">Begin</label>
          <input type="datetime-local" name="begin" required class="input input-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">End</label>
          <input type="datetime-local" name="end" required class="input input-sm">
        </div>
        <button type="submit" class="btn btn-primary btn-xs">Add</button>
      </div>
    </form>
  </details>
  <% } %>
</div>
