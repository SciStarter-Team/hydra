<dialog data-notifications class="rounded-lg shadow-xl max-w-md w-full backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        hx-on:click="if (event.target.tagName === 'DIALOG') this.remove()">
  <div class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-primary-dark">Add to My Lists</h3>
      <button hx-on:click="this.closest('dialog').remove()" class="text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="w-4 h-4 fill-current"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
    </div>

    <% if self.lists.is_empty() { %>
    <p class="text-sm text-gray-600">You don't have any lists yet.</p>
    <% } else { %>
    <div class="space-y-2">
      <% for list in &self.lists { %>
      <form hx-post="/-detail/<%= &self.target_id %>/add-to-list" hx-swap="outerHTML" class="flex items-center gap-2">
        <input type="hidden" name="list_id" value="<%= list.list_id|disp %>">
        <button type="submit" class="flex-1 text-left px-3 py-2 border border-linework rounded-sm hover:bg-gray-50 text-sm text-primary-action hover:underline">
          <%= &list.name %>
        </button>
      </form>
      <% } %>
    </div>
    <% } %>
  </div>
</dialog>
