<dialog class="rounded-lg shadow-xl max-w-md w-full backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        hx-on:click="if (event.target.tagName === 'DIALOG') this.remove()">
  <div class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-primary-dark">Message "<%= &self.name %>"</h3>
      <button hx-on:click="this.closest('dialog').remove()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="w-4 h-4 fill-current"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
    </div>

    <p class="text-sm text-gray-600 mb-4">Your message goes to this project's coordinators. You can message one project per day.</p>

    <form hx-post="/dashboard/messages/send"
          hx-target="#message-send-error"
          hx-swap="innerHTML"
          class="grid grid-cols-1 gap-3">
      <input type="hidden" name="to" value="<%= &self.target_id %>" />
      <label class="block">
        <span class="block text-sm mb-1 font-semibold">Subject</span>
        <input type="text" name="subject" required class="w-full border border-linework rounded px-3 py-2" />
      </label>
      <label class="block">
        <span class="block text-sm mb-1 font-semibold">Message</span>
        <textarea name="body" rows="5" required class="w-full border border-linework rounded px-3 py-2"></textarea>
      </label>
      <div id="message-send-error" class="empty:hidden text-sm text-red-600"></div>
      <div class="flex justify-end gap-2">
        <button type="button" class="btn btn-secondary btn-thin" hx-on:click="this.closest('dialog').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-thin">Send</button>
      </div>
    </form>
  </div>
</dialog>
