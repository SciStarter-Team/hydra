<dialog class="rounded-lg shadow-xl max-w-md w-full backdrop:bg-gray-500 backdrop:opacity-75 m-auto"
        hx-on::after:init="this.showModal()"
        hx-on:click="if (event.target.tagName === 'DIALOG') this.remove()">
  <div class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-primary-dark">Share</h3>
      <button hx-on:click="this.closest('dialog').remove()" class="text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="w-4 h-4 fill-current"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
      </button>
    </div>

    <p class="text-sm text-gray-600 mb-4">Share "<%= &self.name %>"</p>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Link</label>
      <div class="flex gap-2">
        <input id="share-url" type="text" readonly value="<%= &self.share_url %>" class="flex-1 border border-linework rounded px-3 py-2 text-sm bg-gray-50">
        <button hx-on:click="navigator.clipboard.writeText(document.getElementById('share-url').value); this.textContent='Copied!'" class="btn btn-primary btn-thin">Copy</button>
      </div>
    </div>

    <div class="flex gap-4 justify-center">
      <a href="<%= &self.facebook_url %>" target="_blank" rel="noopener" data-no-track aria-label="Share on Facebook" class="text-primary-action hover:text-primary-action-dark" data-share-target="<%= &self.target_id %>" data-share-platform="facebook" hx-on:click="ssRecordShare(this)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-8 h-8 fill-current"><path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64h98.2V334.2H109.4V256h52.8V222.3c0-87.1 39.4-127.5 125-127.5c16.2 0 44.2 3.2 55.7 6.4V172c-6-.6-16.5-1-29.6-1c-42 0-58.2 15.9-58.2 57.2V256h83.6l-14.4 78.2H255V480H384c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64z"/></svg>
      </a>
      <a href="<%= &self.twitter_url %>" target="_blank" rel="noopener" data-no-track aria-label="Share on X (Twitter)" class="text-primary-action hover:text-primary-action-dark" data-share-target="<%= &self.target_id %>" data-share-platform="twitter" hx-on:click="ssRecordShare(this)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-8 h-8 fill-current"><path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64zm297.1 84L257.3 234.6 379.4 396H283.8L209 298.1 123.3 396H75.8l111-126.9L69.7 116h98l67.7 89.5L313.6 116h47.5zM323.3 367.6L153.4 142.9H125.1L296.9 367.6h26.3z"/></svg>
      </a>
      <button type="button" aria-label="Share on Instagram" class="text-primary-action hover:text-primary-action-dark cursor-pointer bg-transparent border-0 p-0 leading-none"
              data-share-url="<%= &self.share_url %>"
              data-share-image="<%= &self.image %>"
              data-share-caption="<%= &self.name %>"
              data-share-target="<%= &self.target_id %>"
              data-share-platform="instagram"
              hx-on:click="ssShareToInstagram(this)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-8 h-8 fill-current"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>
      </button>
      <a href="<%= &self.linkedin_url %>" target="_blank" rel="noopener" data-no-track aria-label="Share on LinkedIn" class="text-primary-action hover:text-primary-action-dark" data-share-target="<%= &self.target_id %>" data-share-platform="linkedin" hx-on:click="ssRecordShare(this)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-8 h-8 fill-current"><path d="M416 32H31.9C14.3 32 0 46.5 0 64.3v383.4C0 465.5 14.3 480 31.9 480H416c17.6 0 32-14.5 32-32.3V64.3c0-17.8-14.4-32.3-32-32.3zM135.4 416H69V202.2h66.5V416zm-33.2-243c-21.3 0-38.5-17.3-38.5-38.5S80.9 96 102.2 96c21.2 0 38.5 17.3 38.5 38.5 0 21.3-17.2 38.5-38.5 38.5zm282.1 243h-66.4V312c0-24.8-.5-56.7-34.5-56.7-34.6 0-39.9 27-39.9 54.9V416h-66.4V202.2h63.7v29.2h.9c8.9-16.8 30.6-34.5 62.9-34.5 67.2 0 79.7 44.3 79.7 101.9V416z"/></svg>
      </a>
    </div>

    <p id="ig-share-status" class="text-xs text-center text-gray-500 mt-4" hidden></p>
  </div>
</dialog>
