<div class="ss-container !pt-8 !pb-8 mx-auto px-4">
  <div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Password Required</h2>
      <p class="text-gray-600 mb-6">This page is password protected. Please enter the password to continue.</p>

      <% if self.error { %>
        <div class="mb-4 p-3 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200">
          Incorrect password. Please try again.
        </div>
      <% } %>

      <form method="post" action="/-entity-password/<%= self.slug %>">
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          >
        </div>
        <button
          type="submit"
          class="w-full btn btn-primary"
        >
          Submit
        </button>
      </form>
    </div>
  </div>
</div>
