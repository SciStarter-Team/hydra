<% use crate::add::SectionSummary; %>
<details class="add-section">
  <%+ SectionSummary::new(self.icon, self.title.clone()) %>
  <div class="add-section-body" role="group" aria-label="<%= self.title %>">
    <% for checkboxes in self.checkboxes { %>
    <%+ checkboxes %>
    <% } %>
  </div>
</details>
