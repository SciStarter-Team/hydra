<ul class="border border-linework rounded-md divide-y divide-linework mt-1">
  <% for (id, name) in &self.events { %>
    <li>
      <button type="button" class="w-full text-left px-3 py-2 hover:bg-linework"
        hx-get="/add-event/parent-select?id=<%= id %>" hx-target="#parent-selected" hx-swap="innerHTML">
        <%= name %>
      </button>
    </li>
  <% } %>
  <% if self.events.is_empty() { %>
    <li class="px-3 py-2 text-sm text-neutral-mid">No matching events.</li>
  <% } %>
</ul>
<span id="parent-results-status" hx-swap-oob="innerHTML"><% if self.events.is_empty() { %>No matching events<% } else if self.events.len() == 1 { %>1 matching event<% } else { %><%= self.events.len() %> matching events<% } %></span>
