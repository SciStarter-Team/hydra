<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;800;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<% if self.enable_webawesome { %>
  <link rel="stylesheet" href="/-static/webawesome/styles/utilities.css" />
  <%# Leaving out WebAwesome's native.css on purpose, it's optional and would conflict with Tailwind %>
  <link rel="stylesheet" href="/-static/webawesome/styles/themes/default.css" />
<% } %>
<link rel=stylesheet href="/-static/css/style.css"/>
<script src="/-static/htmx.js"></script>
<% if self.enable_sse { %><script src="/-static/hx-sse.js"></script><% } %>
<% if self.enable_alpine { %>
  <script src="/-static/hx-alpine-morph.js"></script>
  <script src="/-static/alpine-morph.js" defer></script>
  <script src="/-static/alpine.js" defer></script>
<% } %>
<% if self.enable_webawesome { %>
  <script type="module" src="/-static/webawesome/webawesome.loader.js"></script>
  <style>body:not([data-loading-phase-over]):has(:not(:defined)),:not(:defined){opacity:0;}</style>
  <script>setTimeout(() => {document.body.dataset.loadingPhaseOver=true;}, 2000);</script>
<% } %>
