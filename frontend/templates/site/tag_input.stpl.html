<div data-tag-input>
  <ul class="tag-pills flex flex-wrap gap-2 empty:hidden mb-2 list-none m-0 p-0" aria-label="Tags added"></ul>
  <input type="hidden" name="tags" class="tags-value" value="<%= self.value %>">
  <div class="relative">
    <div class="pill-field">
      <label class="pill-body">
        <span class="pill-label">Tags</span>
        <input type="text" name="q" class="tag-input" placeholder=" " autocomplete="off" aria-describedby="tag-input-help"
          hx-get="/add/tag-search" hx-trigger="input changed delay:200ms" hx-target="next .tag-suggestions" hx-swap="innerHTML">
      </label>
    </div>
    <div class="tag-suggestions border border-linework rounded-md mt-1 bg-white empty:hidden"></div>
  </div>
  <p id="tag-input-help" class="field-help">Press Enter or pick a suggestion to add a tag.</p>
  <%# Present from the start, so changes to it are announced: suggestion counts
      (written out-of-band by /add/tag-search) and tags added or removed. %>
  <span id="tag-input-status" class="sr-only" role="status" data-tag-status></span>
</div>
