<div class="ss-project-card">
  <a href="<%= self.link %>" class="w-full flex flex-col sm:flex-row bg-white shadow-md mx-auto mb-4 border border-primary-light rounded-md overflow-hidden no-underline">
    <img src="<%= self.image %>" alt="<%= self.alt %>" class="w-full sm:w-[300px] self-start sm:max-w-[33%]" />
    <div class="flex flex-col p-4 justify-center relative gap-4 w-full">
      <div>
        <% if self.completed { %>
        <div class="ss-complete flex gap-2 text-accent2-dark mb-2 font-bold">
          <svg width="22px" class="fill-accent2-dark" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 682.7 682.7"><path d="M341.3,0C152.8,0,0,152.8,0,341.4s152.8,341.4,341.4,341.4,341.4-152.8,341.4-341.4S529.9,0,341.3,0ZM341.3,616.8c-152.1,0-275.4-123.3-275.4-275.4S189.2,65.9,341.3,65.9s275.5,123.3,275.5,275.5-123.3,275.4-275.5,275.4Z"/><path d="M291.9,456.3c-6.7,0-13.5-2.6-18.6-7.8l-84.8-86.4c-10.1-10.3-9.9-26.7.4-36.8,10.3-10.1,26.7-9.9,36.8.4l66.7,68,165.1-159.9c10.3-10,26.8-9.7,36.8.6,10,10.3,9.7,26.8-.6,36.8l-183.6,177.8c-5,4.9-11.6,7.3-18.1,7.3Z"/></svg>
          Completed!
        </div>
        <% } %>
        <h3 class="text-lg mb-2! text-primary-dark"><%= self.title %></h3>
        <p class="text-sm mb-4! text-neutral-dark"><%= self.description %></p>
        <div class="ss-cat-tags flex gap-2 flex-wrap">
          <span class="bg-accent2 px-2 rounded-xs text-white flex flex-nowrap w-auto text-nowrap text-sm"><svg class="w-[10px] mr-2 fill-white" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="m256 0c-141.164062 0-256 114.835938-256 256s114.835938 256 256 256 256-114.835938 256-256-114.835938-256-256-256zm121.75 388.414062c-4.160156 4.160157-9.621094 6.253907-15.082031 6.253907-5.460938 0-10.925781-2.09375-15.082031-6.253907l-106.667969-106.664062c-4.011719-3.988281-6.25-9.410156-6.25-15.082031v-138.667969c0-11.796875 9.554687-21.332031 21.332031-21.332031s21.332031 9.535156 21.332031 21.332031v129.835938l100.417969 100.414062c8.339844 8.34375 8.339844 21.824219 0 30.164062zm0 0"></path></svg> <%= self.time_tag %></span>
          <span class="bg-accent2 px-2 rounded-xs text-white flex flex-nowrap w-auto text-nowrap text-sm"><svg class="w-[12px] mr-1 fill-white" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256,0C153.755,0,70.573,83.182,70.573,185.426c0,126.888,165.939,313.167,173.004,321.035c6.636,7.391,18.222,7.378,24.846,0c7.065-7.868,173.004-194.147,173.004-321.035C441.425,83.182,358.244,0,256,0z M256,278.719c-51.442,0-93.292-41.851-93.292-93.293S204.559,92.134,256,92.134s93.291,41.851,93.291,93.293S307.441,278.719,256,278.719z"></path></svg> <%= self.place_tag %></span>
        </div>
        <span class="btn btn-primary mt-4">Participate</span>
      </div>
    </div>
  </a>
</div>
