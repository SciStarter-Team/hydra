<div class="ss-accordion-wrapper">
  <% for step in &self.steps { %>
  <div class="ss-training-step ss-accordion <%= step.state.css_class() %><% if step.open { %> open<% } %>">
    <button type="button" class="w-full flex justify-between items-center px-4 py-3 text-left font-semibold focus:outline-none accordion-toggle">
      <div class="flex gap-6 items-center !mb-0">
        <% if step.state.is_completed() { %>
        <span class="font-condensed text-xl font-bold !mb-0"><svg width="22px" class="fill-accent2-dark" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 682.7 682.7"><path d="M341.3,0C152.8,0,0,152.8,0,341.4s152.8,341.4,341.4,341.4,341.4-152.8,341.4-341.4S529.9,0,341.3,0ZM341.3,616.8c-152.1,0-275.4-123.3-275.4-275.4S189.2,65.9,341.3,65.9s275.5,123.3,275.5,275.5-123.3,275.4-275.5,275.4Z"/><path d="M291.9,456.3c-6.7,0-13.5-2.6-18.6-7.8l-84.8-86.4c-10.1-10.3-9.9-26.7.4-36.8,10.3-10.1,26.7-9.9,36.8.4l66.7,68,165.1-159.9c10.3-10,26.8-9.7,36.8.6,10,10.3,9.7,26.8-.6,36.8l-183.6,177.8c-5,4.9-11.6,7.3-18.1,7.3Z"/></svg></span>
        <% } else { %>
        <span class="font-condensed text-xl font-bold !mb-0">&#x27A4;</span>
        <% } %>
        <%= step.heading %>
      </div>
      <svg class="w-5 h-5 transition-transform duration-200 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div class="p-8 accordion-content"><%- step.body %></div>
  </div>
  <% } %>
</div>
