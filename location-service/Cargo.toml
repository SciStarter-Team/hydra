[package]
name = "location-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-nats = { version = "0.42.0", features = ["service"] }
common = { version = "0.1.0", path = "../common" }
flexbuffers = "25.2.10"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "sqlite-load-extension", "macros", "migrate", "sqlx-toml"] }
tokio = { version = "1.47.1", features = ["full"] }
