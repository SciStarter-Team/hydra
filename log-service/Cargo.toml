[package]
name = "log-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "log-service"

[[bin]]
name = "analytics-shell"
path = "src/bin/shell/main.rs"

[dependencies]
common = { version = "0.1.0", path = "../common" }
thiserror = "2.0"
anyhow = "1.0.98"
async-nats = { version = "0.41.0", features = ["service"] }
datafusion = "49.0"
arrow = "55.0"
parquet = "55.0"
object_store = "0.12"
flexbuffers = "25.2.10"
futures = "0.3.31"
jiff = { version = "0.2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
sqlx = { features = ["runtime-tokio", "sqlite", "macros", "migrate", "sqlx-toml"], path = "/home/djarb/source/others/sqlx/" }
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = "0.7"
ulid = { version = "1.2.1", features = ["serde"] }
url = "2.5"
# Analytics shell dependencies
ratatui = "0.29"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
inventory = "0.3"

[dev-dependencies]
tempfile = "3.15.0"