[package]
name = "log-service"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common", default-features = false }
anyhow = "1.0.98"
async-nats = { version = "0.41.0", features = ["service"] }
duckdb = { version = "1.3.2", features = ["bundled"] }
flexbuffers = "25.2.10"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["full"] }
ulid = { version = "1.2.1", features = ["serde"] }