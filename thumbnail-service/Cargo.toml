[package]
name = "thumbnail-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
image = "0.25"
poem = { version = "3.1.12", features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
