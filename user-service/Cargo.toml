[package]
name = "user-service"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
anyhow = "1.0.99"
async-nats = { version = "0.42.0", features = ["service"] }
flexbuffers = "25.2.10"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "sqlite-load-extension", "macros", "migrate", "sqlx-toml"] }
tokio = { version = "1.47.1", features = ["full"] }
ulid = { version = "1.2.1", features = ["serde"] }
jiff = "0.2.15"
reqwest = { version = "0.12.23", features = ["json"] }
djangohashers = "1.8.2"
webauthn-rs = { version = "0.5.2", features = ["danger-allow-state-serialisation"] }
uuid = "1.18"
url = "2.5.4"
base64 = "0.22.1"
rand = "0.8"

